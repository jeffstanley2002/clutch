[project]
name = "clutch"
version = "0.1.0"
description = "AI code review and interview prep partner for junior engineers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    "langgraph>=1.0.0,<2.0.0",
    "langfuse>=4.15.0,<5.0.0",
    "mcp>=2.0.0,<3.0.0",
    "openai>=2.0.0,<3.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "redis>=8.0.0,<9.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "streamlit>=1.38.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
clutch-github-mcp = "clutch.agent.mcp_server.__main__:main"

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0,<1.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "mypy>=1.14.0,<2.0.0",
    "pip-audit>=2.9.0,<3.0.0",
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.package-data]
"clutch.prompts" = ["*.txt"]
"clutch.knowledge_base" = ["*.json"]
