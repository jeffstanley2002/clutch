[project]
name = "clutch"
version = "0.1.0"
description = "AI code review and interview prep partner for junior engineers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "streamlit>=1.38.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
ai = [
    "langgraph>=0.2.0",
    "openai>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
