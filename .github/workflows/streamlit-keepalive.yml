name: Streamlit keep-alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    name: Load app to prevent Community Cloud idle sleep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.STREAMLIT_APP_URL }}
    steps:
      - name: Check APP_URL is configured
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the STREAMLIT_APP_URL repository variable to your app's public URL."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.48.0 install --with-deps chromium
      - name: Open the app in a real browser session
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(process.env.APP_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(5000);
            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          "
