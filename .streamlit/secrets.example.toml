CLUTCH_API_BASE_URL = "http://127.0.0.1:8000"
CLUTCH_API_KEY = "replace-with-the-same-key-used-by-fastapi" # pragma: allowlist secret -- placeholder

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "replace-with-a-random-long-string" # pragma: allowlist secret -- placeholder
client_id = "replace-with-google-oauth-client-id"
client_secret = "replace-with-google-oauth-client-secret" # pragma: allowlist secret -- placeholder
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
